<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <title>AI 提示词 · Error酱</title>
  <meta name="tab-name" content="ej-prompts">
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=3">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=3">
  <link rel="stylesheet" href="/static/prompts.css">
  <link rel="stylesheet" href="/static/site/rain.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
  <script src="/static/site/tabname.js"></script>
  <link rel="stylesheet" href="/static/fonts.css">
</head>
<body>
  <div class="rain-scene rain-scene--fixed" id="rainScene" aria-hidden="true">
    <div class="rain-layer" id="rainLayer"></div>
    <div class="rain-floor" id="rainFloor"></div>
  </div>

  <div class="pr-app">
    <main class="pr-main">
      <section class="pr-hero">
        <p class="pr-eyebrow">PROMPT LIBRARY · V1</p>
        <h1>把常用的好提示词放在手边</h1>
        <p>编程、调试、学习、写作、运维和电子制作，第一版先提供只读提示词库。</p>
      </section>

      <section class="pr-toolbar">
        <label class="pr-search">
          <i data-lucide="search"></i>
          <input id="promptSearch" type="search" placeholder="搜索提示词、标签或用途">
        </label>
        <div class="pr-tabs" id="promptTabs"></div>
      </section>

      <section class="pr-grid" id="promptGrid"></section>
      <div class="pr-empty" id="promptEmpty" hidden>没有匹配的提示词。</div>
    </main>

    <button class="pr-add" id="promptAddBtn" type="button" hidden>
      <i data-lucide="plus"></i><span>新增提示词</span>
    </button>
  </div>

  <div class="pr-modal" id="promptModal" hidden>
    <div class="pr-dialog" role="dialog" aria-modal="true" aria-labelledby="promptModalTitle">
      <button class="pr-dialog-close" id="promptModalClose" type="button" aria-label="关闭">×</button>
      <h2 id="promptModalTitle">新增提示词</h2>
      <form id="promptForm">
        <div class="pr-form-grid">
          <label>
            <span>标题</span>
            <input id="promptTitle" maxlength="120" required>
          </label>
          <label>
            <span>分类</span>
            <input id="promptCategory" maxlength="40" placeholder="例如：编程">
          </label>
        </div>
        <label>
          <span>说明</span>
          <input id="promptDescription" maxlength="300" placeholder="这个提示词适合做什么">
        </label>
        <label>
          <span>标签</span>
          <input id="promptTags" maxlength="200" placeholder="用逗号分隔">
        </label>
        <label>
          <span>提示词内容</span>
          <textarea id="promptBody" rows="10" maxlength="12000" required></textarea>
        </label>
        <div class="pr-form-error" id="promptFormError" hidden></div>
        <div class="pr-dialog-actions">
          <button class="pr-action" id="promptCancel" type="button">取消</button>
          <button class="pr-action primary" id="promptSave" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="pr-preview" id="promptPreview" hidden>
    <div class="pr-preview-dialog" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
      <button class="pr-dialog-close" id="promptPreviewClose" type="button" aria-label="关闭">×</button>
      <div class="pr-preview-head">
        <span class="pr-preview-category" id="previewCategory"></span>
        <h2 id="previewTitle"></h2>
        <p class="pr-preview-description" id="previewDescription"></p>
      </div>
      <div class="pr-preview-tags" id="previewTags"></div>
      <pre class="pr-preview-body" id="previewBody"></pre>
      <div class="pr-preview-actions">
        <button class="pr-action primary" id="previewCopy" type="button">复制提示词</button>
        <button class="pr-action" id="promptPreviewCloseFooter" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div class="pr-toast" id="promptToast" hidden></div>

  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/site/rain.js"></script>
  <script src="/static/prompts.js"></script>
</body>
</html>
