<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <title>登录 · Error酱</title>
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=3">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=3">
  <link rel="stylesheet" href="/static/site/rain.css">
  <style>
    :root {
      color-scheme: light;
    }

    [data-theme="dark"] {
      color-scheme: dark;
    }

    body {
      margin: 0;
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--rain-top, #ffffff);
      color: #1f2329;
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      font-size: 14px;
    }

    [data-theme="dark"] body {
      color: #f4f4f5;
    }

    .login-card {
      position: relative;
      z-index: 1;
      box-sizing: border-box;
      width: min(380px, 100%);
      padding: 28px 26px 24px;
      border: 1px solid rgba(127, 127, 145, 0.28);
      border-radius: 12px;
      background: color-mix(in srgb, var(--rain-top, #ffffff) 86%, transparent);
      box-shadow: 0 16px 48px rgba(24, 31, 45, 0.18);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    [data-theme="dark"] .login-card {
      background: rgba(38, 38, 38, 0.86);
    }

    .login-card h1 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .login-card p {
      margin: 0 0 20px;
      font-size: 13px;
      opacity: 0.7;
    }

    .login-field {
      display: block;
      text-align: left;
      margin-bottom: 14px;
    }

    .login-field span {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      opacity: 0.72;
    }

    .login-field input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(127, 127, 145, 0.36);
      border-radius: 8px;
      background: rgba(127, 127, 145, 0.08);
      color: inherit;
      font: inherit;
    }

    .login-field input:focus {
      outline: 2px solid #7b68ee;
      outline-offset: -1px;
    }

    .login-remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      opacity: 0.85;
    }

    .login-remember input {
      width: 15px;
      height: 15px;
      accent-color: #7b68ee;
    }

    .login-submit {
      width: 100%;
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #7b68ee;
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .login-submit:hover {
      background: #6956e5;
    }

    .login-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-error {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(214, 69, 69, 0.12);
      color: #d64545;
      font-size: 13px;
    }

    .login-error[hidden] {
      display: none;
    }

    .login-back {
      display: inline-block;
      margin-top: 18px;
      font-size: 13px;
      color: inherit;
      opacity: 0.7;
      text-decoration: none;
    }

    .login-back:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "light";
        var dark = pref === "dark";
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/fonts.css">
</head>
<body>
  <div class="rain-scene rain-scene--fixed" id="rainScene" aria-hidden="true">
    <div class="rain-layer" id="rainLayer"></div>
    <div class="rain-floor" id="rainFloor"></div>
  </div>

  <form class="login-card" id="loginForm">
    <h1>Error酱</h1>
    <p>管理员可留空用户名；普通账号填写已批准的用户名</p>

    <label class="login-field">
      <span>用户名</span>
      <input type="text" id="username" autocomplete="username" placeholder="管理员可留空" autofocus>
    </label>

    <label class="login-field">
      <span>密码</span>
      <input type="password" id="password" autocomplete="current-password" required>
    </label>

    <label class="login-remember">
      <input type="checkbox" id="remember">
      <span>记住我（30 天）</span>
    </label>

    <button class="login-submit" type="submit" id="submitBtn">登录</button>
    <div class="login-error" id="error" hidden></div>
    <a class="login-back" href="/register">申请注册账号</a>
  </form>

  <script src="/static/site/rain.js"></script>
  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var button = document.getElementById("submitBtn");
      var errorBox = document.getElementById("error");
      var next = new URLSearchParams(location.search).get("next") || "/";

      // 服务端（含 nginx 白名单）返回的不是 JSON 时，也要把真实原因显示出来
      function loginError(response, text, data) {
        if (data && data.error) return data.error;
        if (response.status === 403) {
          var hint = String(text || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
          return hint.slice(0, 80) || "管理员登录仅限受信任的网络，换到常用网络再试。";
        }
        return "登录失败（" + response.status + "）";
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        errorBox.hidden = true;
        button.disabled = true;
        var account = document.getElementById("username").value.trim();
        fetch(account ? "/api/member/login" : "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: account,
            password: document.getElementById("password").value,
            remember: document.getElementById("remember").checked,
          }),
        }).then(function (response) {
          return response.text().then(function (text) {
            var data = {};
            try {
              data = JSON.parse(text);
            } catch (err) {}
            if (!response.ok) throw new Error(loginError(response, text, data));
            location.href = next.startsWith("/") && !next.startsWith("//") ? next : "/";
          });
        }).catch(function (err) {
          errorBox.textContent = err.message;
          errorBox.hidden = false;
          button.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
