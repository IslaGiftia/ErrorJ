<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <title>AA 分账</title>
  <meta name="tab-name" content="ej-aa">
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=4">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=4">
  <link rel="stylesheet" href="/static/aa.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
  <script src="/static/site/tabname.js"></script>
  <link rel="stylesheet" href="/static/fonts.css">
</head>
<body>
  <div class="aa-app">
    <header class="aa-header">
      <a class="aa-brand" href="/" data-back data-back-parent="/" title="返回首页">
        <span class="aa-brand-icon"><i data-lucide="receipt-text"></i></span>
        <strong>AA 分账</strong>
        <span id="eventCount">0 个活动</span>
      </a>
      <div class="aa-header-actions">
        <button class="aa-btn aa-btn-primary" id="newEventBtn" type="button">
          <i data-lucide="plus"></i><span>新建分账</span>
        </button>
      </div>
    </header>

    <div class="aa-layout">
      <aside class="aa-sidebar">
        <div class="aa-sidebar-head">
          <div>
            <h2>分账活动</h2>
            <p>最近更新</p>
          </div>
        </div>
        <div class="aa-event-list" id="eventList"></div>
      </aside>

      <main class="aa-main">
        <section class="aa-empty" id="emptyState">
          <span class="aa-empty-icon"><i data-lucide="receipt-text"></i></span>
          <h1>还没有分账活动</h1>
          <p>新建一个活动，把参与人和费用记在一起。</p>
          <button class="aa-btn aa-btn-primary" id="emptyCreateBtn" type="button">
            <i data-lucide="plus"></i><span>新建分账</span>
          </button>
        </section>

        <section class="aa-event" id="eventView" hidden>
          <header class="aa-event-head">
            <div class="aa-event-heading">
              <p class="aa-kicker">分账活动</p>
              <h1 id="eventTitle"></h1>
              <p id="eventMeta"></p>
            </div>
            <div class="aa-event-actions" id="eventActions">
              <button class="aa-btn" id="editEventBtn" type="button">
                <i data-lucide="users"></i><span>参与人</span>
              </button>
              <button class="aa-btn aa-btn-danger" id="deleteEventBtn" type="button">
                <i data-lucide="trash-2"></i><span>删除</span>
              </button>
            </div>
          </header>

          <section class="aa-overview" aria-label="分账概览">
            <div class="aa-metric">
              <span>总支出</span>
              <strong id="metricTotal">¥0.00</strong>
            </div>
            <div class="aa-metric">
              <span>人均</span>
              <strong id="metricAverage">¥0.00</strong>
            </div>
            <div class="aa-metric" id="metricBalanceBox">
              <span>我的结算</span>
              <strong id="metricBalance">¥0.00</strong>
            </div>
          </section>

          <div class="aa-content-grid">
            <section class="aa-panel aa-expenses-panel">
              <header class="aa-panel-head">
                <div>
                  <h2>费用记录</h2>
                  <p id="expenseMeta">0 笔</p>
                </div>
                <button class="aa-btn aa-btn-primary" id="addExpenseBtn" type="button">
                  <i data-lucide="plus"></i><span>记一笔</span>
                </button>
              </header>
              <div class="aa-expense-list" id="expenseList"></div>
            </section>

            <aside class="aa-side-column">
              <section class="aa-panel aa-receipt-panel">
                <header class="aa-panel-head">
                  <div>
                    <h2>收款码</h2>
                    <p id="receiptMeta">未设置</p>
                  </div>
                </header>
                <div class="aa-receipt" id="receiptBox"></div>
              </section>

              <section class="aa-panel">
                <header class="aa-panel-head">
                  <div>
                    <h2>成员结算</h2>
                    <p>按人数平均分摊</p>
                  </div>
                </header>
                <div class="aa-balance-list" id="balanceList"></div>
              </section>

              <section class="aa-panel">
                <header class="aa-panel-head">
                  <div>
                    <h2>转账方案</h2>
                    <p id="transferMeta">0 笔</p>
                  </div>
                </header>
                <div class="aa-transfer-list" id="transferList"></div>
              </section>
            </aside>
          </div>
        </section>
      </main>
    </div>
  </div>

  <dialog class="aa-dialog" id="eventDialog">
    <form id="eventForm" method="dialog" novalidate>
      <header class="aa-dialog-head">
        <div>
          <h2 id="eventDialogTitle">新建分账</h2>
          <p>发起人会默认加入活动。</p>
        </div>
        <button class="aa-icon-btn" id="eventDialogClose" type="button" aria-label="关闭">
          <i data-lucide="x"></i>
        </button>
      </header>
      <div class="aa-dialog-body">
        <label class="aa-field">
          <span>活动名称</span>
          <input id="eventTitleInput" type="text" maxlength="80" placeholder="例如：周末聚餐" required>
        </label>
        <div class="aa-participant-head">
          <div>
            <strong>参与人</strong>
            <span id="participantCount">已选 1 人</span>
          </div>
          <label class="aa-search">
            <i data-lucide="search"></i>
            <input id="participantSearch" type="search" placeholder="搜索账号">
          </label>
        </div>
        <div class="aa-participant-list" id="participantList"></div>
        <p class="aa-form-hint" id="participantHint"></p>
      </div>
      <footer class="aa-dialog-actions">
        <button class="aa-btn" id="eventDialogCancel" type="button">取消</button>
        <button class="aa-btn aa-btn-primary" id="eventDialogSubmit" type="submit">
          <i data-lucide="check"></i><span>保存</span>
        </button>
      </footer>
    </form>
  </dialog>

  <dialog class="aa-dialog aa-dialog-small" id="expenseDialog">
    <form id="expenseForm" method="dialog" novalidate>
      <header class="aa-dialog-head">
        <div>
          <h2 id="expenseDialogTitle">记一笔</h2>
          <p id="expenseDialogMeta"></p>
        </div>
        <button class="aa-icon-btn" id="expenseDialogClose" type="button" aria-label="关闭">
          <i data-lucide="x"></i>
        </button>
      </header>
      <div class="aa-dialog-body">
        <label class="aa-field">
          <span>金额</span>
          <div class="aa-money-input">
            <span>¥</span>
            <input id="expenseAmountInput" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" required>
          </div>
        </label>
        <label class="aa-field">
          <span>备注</span>
          <input id="expenseNoteInput" type="text" maxlength="120" placeholder="例如：火锅、饮料、打车">
        </label>
      </div>
      <footer class="aa-dialog-actions">
        <button class="aa-btn" id="expenseDialogCancel" type="button">取消</button>
        <button class="aa-btn aa-btn-primary" id="expenseDialogSubmit" type="submit">
          <i data-lucide="check"></i><span>保存</span>
        </button>
      </footer>
    </form>
  </dialog>

  <dialog class="aa-dialog aa-dialog-small" id="confirmDialog">
    <div class="aa-dialog-head">
      <div>
        <h2 id="confirmTitle">确认操作</h2>
        <p id="confirmText"></p>
      </div>
    </div>
    <footer class="aa-dialog-actions">
      <button class="aa-btn" id="confirmCancel" type="button">取消</button>
      <button class="aa-btn aa-btn-danger" id="confirmOk" type="button">确定</button>
    </footer>
  </dialog>

  <div class="aa-qr-viewer" id="qrViewer" hidden>
    <button class="aa-qr-viewer-close" id="qrViewerClose" type="button" aria-label="关闭">
      <i data-lucide="x"></i>
    </button>
    <img id="qrViewerImage" alt="收款码">
  </div>

  <input type="file" id="receiptInput" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" hidden>
  <div class="aa-toast" id="toast" hidden></div>

  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/site/back-link.js"></script>
  <script src="/static/aa.js"></script>
</body>
</html>
