<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <title>ErrorJ Agent</title>
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=4">
  <link rel="stylesheet" href="/static/site/site.css">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/agent.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
</head>
<body class="agent-page" data-agent-online="0">
  <header class="agent-topbar">
    <a class="agent-back" href="/" aria-label="返回首页">
      <i data-lucide="arrow-left"></i>
      <span>返回</span>
    </a>
    <div class="agent-topbar-title">
      <span>Error酱工作区</span>
      <strong>ErrorJ Agent</strong>
    </div>
    <span class="agent-top-status">
      <i></i>
      <span id="agentTopStatus">连接中</span>
    </span>
  </header>

  <main class="agent-shell">
    <aside class="agent-sidebar">
      <section class="agent-identity">
        <div class="agent-portrait">
          <img src="/static/site/error-chan-avatar.png?v=1" alt="Error酱">
        </div>
        <div class="agent-identity-copy">
          <h1>ErrorJ Agent</h1>
          <p id="agentStatusText">正在连接 Agent</p>
          <span class="agent-model-pill" id="agentModelPill">DeepSeek</span>
        </div>
      </section>

      <section class="agent-side-section agent-capabilities">
        <h2>可以做什么</h2>
        <div class="agent-capability-list">
          <div><i data-lucide="package-search"></i><span>查询元件库存</span></div>
          <div><i data-lucide="bookmark"></i><span>搜索收藏网站</span></div>
          <div><i data-lucide="notebook-tabs"></i><span>读取与总结笔记</span></div>
          <div><i data-lucide="badge-check"></i><span>整理待审核事项</span></div>
        </div>
      </section>

      <section class="agent-side-section agent-runtime">
        <h2>运行状态</h2>
        <dl>
          <div><dt>模型</dt><dd id="agentModel">--</dd></div>
          <div><dt>管理员</dt><dd id="agentAdmins">--</dd></div>
          <div><dt>通知群</dt><dd id="agentGroups">--</dd></div>
        </dl>
      </section>
    </aside>

    <section class="agent-workspace">
      <header class="agent-chat-head">
        <div>
          <h2>对话</h2>
          <p>直接提问，Agent 会按权限调用 Error酱工具。</p>
        </div>
        <span class="agent-online-chip" id="agentOnlineChip">
          <i></i>
          <span>离线</span>
        </span>
      </header>

      <div class="agent-messages" id="agentMessages" aria-live="polite">
        <article class="agent-message is-assistant">
          <div class="agent-message-avatar">
            <img src="/static/site/error-chan-avatar.png?v=1" alt="">
          </div>
          <div class="agent-message-body">
            <div class="agent-message-meta">
              <strong>ErrorJ Agent</strong>
              <span>现在</span>
            </div>
            <div class="agent-bubble">
              <p>你好，我可以查询库存、书签和笔记，也能整理 Error酱的待审核任务。</p>
            </div>
          </div>
        </article>
      </div>

      <div class="agent-suggestions" id="agentSuggestions" aria-label="快捷提问">
        <button type="button" data-agent-prompt="有哪些待审核用户、留言和举报？">
          <i data-lucide="clipboard-check"></i>
          <span>查看待审核事项</span>
        </button>
        <button type="button" data-agent-prompt="帮我查一下库存里有没有 STM32">
          <i data-lucide="scan-search"></i>
          <span>查询元件库存</span>
        </button>
        <button type="button" data-agent-prompt="帮我找一下和 Docker 有关的笔记">
          <i data-lucide="notebook-pen"></i>
          <span>搜索我的笔记</span>
        </button>
      </div>

      <form class="agent-composer" id="agentForm">
        <textarea id="agentInput" rows="1" maxlength="4000" placeholder="给 ErrorJ Agent 发消息" required></textarea>
        <div class="agent-composer-bar">
          <span id="agentComposerHint">Enter 发送 · Shift + Enter 换行</span>
          <button type="submit" id="agentSend" title="发送消息" aria-label="发送消息">
            <i data-lucide="arrow-up"></i>
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/agent.js"></script>
</body>
</html>
