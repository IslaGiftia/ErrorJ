<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <meta name="tab-name" content="ej-recommendations">
  <title>推荐</title>
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=4">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=4">
  <link rel="stylesheet" href="/static/recommendations.css">
  <link rel="stylesheet" href="/static/site/rain.css">
  <link rel="stylesheet" href="/static/site/report.css">
  <link rel="stylesheet" href="/static/site/fresh-cards.css">
  <link rel="stylesheet" href="/static/site/dropzone.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
  <script src="/static/site/tabname.js"></script>
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/site/embed.css">
  <script src="/static/site/embed.js"></script>
</head>
<body data-notify-module="recommendations">
  <div class="rain-scene rain-scene--fixed" id="rainScene" aria-hidden="true">
    <div class="rain-layer" id="rainLayer"></div>
    <div class="rain-floor" id="rainFloor"></div>
  </div>

  <div class="rec-app">
    <header class="rec-header">
      <a class="rec-brand" href="/">
        <span class="rec-brand-icon"><i data-lucide="sparkles"></i></span>
        <strong>推荐</strong>
        <span id="recCount">0 项</span>
      </a>

      <label class="rec-search">
        <i data-lucide="search"></i>
        <input id="recSearch" type="search" placeholder="搜索推荐内容、标签或分类">
      </label>

      <div class="rec-header-actions">
        <a class="rec-btn" href="/">返回首页</a>
        <button class="rec-btn rec-btn-primary" id="recAddBtn" type="button" hidden>
          <i data-lucide="plus"></i><span>新增推荐</span>
        </button>
      </div>
    </header>

    <main class="rec-main">
      <section class="rec-toolbar">
        <div class="rec-tabs" id="recTabs">
          <button class="active" type="button" data-tab="all">全部</button>
          <button type="button" data-tab="web">网站与工具</button>
          <button type="button" data-tab="movie">电影</button>
          <button type="button" data-tab="anime">动漫</button>
          <button type="button" data-tab="resource">站内资源</button>
        </div>
      </section>

      <section class="rec-grid" id="recGrid"></section>
      <div class="rec-empty" id="recEmpty" hidden>还没有推荐内容。</div>
    </main>
  </div>

  <!-- 「+站内」：从笔记 / 歌曲 / 电子书里挑一个分享到站内资源（站内资源只能由分享产生） -->
  <div class="rec-modal" id="recPickModal" hidden>
    <div class="rec-dialog" role="dialog" aria-modal="true" aria-labelledby="recPickTitle">
      <button class="rec-dialog-close" id="recPickClose" type="button" aria-label="关闭">×</button>
      <h2 id="recPickTitle">分享到站内资源</h2>
      <p class="rec-pick-hint">挑一个站内内容分享出去，卡片会出现在「站内资源」里。</p>
      <div class="rec-pick-tabs" id="recPickTabs">
        <button type="button" data-pick="note" class="active">笔记</button>
        <button type="button" data-pick="music">歌曲</button>
        <button type="button" data-pick="book">电子书</button>
      </div>
      <label class="rec-search rec-pick-search">
        <i data-lucide="search"></i>
        <input id="recPickSearch" type="search" placeholder="搜索标题">
      </label>
      <div class="rec-pick-body">
        <div class="rec-pick-list" id="recPickList"></div>
        <div class="rec-empty rec-pick-empty" id="recPickEmpty" hidden>没有可分享的内容。</div>
      </div>
      <div class="rec-pick-feedback" id="recPickFeedback" hidden></div>
    </div>
  </div>

  <div class="rec-modal" id="recModal" hidden>
    <div class="rec-dialog" role="dialog" aria-modal="true" aria-labelledby="recModalTitle">
      <button class="rec-dialog-close" id="recModalClose" type="button" aria-label="关闭">×</button>
      <h2 id="recModalTitle">新增推荐</h2>
      <form id="recForm">
        <div class="rec-form-grid">
          <label class="rec-field">
            <span>类型</span>
            <select id="recKind" required>
              <option value="site">网站</option>
              <option value="tool">工具 / 下载</option>
              <option value="movie">电影</option>
              <option value="anime">动漫</option>
            </select>
          </label>
          <label class="rec-field">
            <span>标题</span>
            <input id="recTitle" maxlength="160" required>
          </label>
        </div>

        <label class="rec-field" data-kinds="movie anime">
          <span>副标题</span>
          <input id="recSubtitle" maxlength="200" placeholder="原名、季数或一句话补充">
        </label>

        <div class="rec-form-grid">
          <label class="rec-field" data-kinds="movie anime">
            <span>分类</span>
            <input id="recCategory" maxlength="40" placeholder="例如：开发工具、动画电影">
          </label>
          <label class="rec-field" data-kinds="movie anime">
            <span>标签</span>
            <input id="recTags" maxlength="300" placeholder="用逗号分隔">
          </label>
        </div>

        <div class="rec-form-grid">
          <label class="rec-field" data-kinds="site tool movie anime">
            <span id="recUrlLabel">访问地址</span>
            <input id="recUrl" type="url" maxlength="1000" placeholder="https://">
          </label>
          <label class="rec-field" data-kinds="tool">
            <span>下载地址</span>
            <input id="recDownloadUrl" type="url" maxlength="1000" placeholder="https://">
          </label>
        </div>

        <div class="rec-bookmark-field" data-kinds="site">
          <div>
            <strong>关联书签</strong>
            <span id="recBookmarkSummary">未关联，可手动填写标题和访问地址。</span>
          </div>
          <div>
            <button class="rec-action" id="recPickBookmark" type="button">选择收藏</button>
            <button class="rec-action" id="recClearBookmark" type="button" hidden>取消关联</button>
          </div>
        </div>

        <div class="rec-form-grid" data-kinds="movie anime">
          <label class="rec-field" data-kinds="movie anime">
            <span>观看状态</span>
            <input id="recStatus" maxlength="20" placeholder="例如：已看、追更中">
          </label>
        </div>

        <div class="rec-form-grid" data-kinds="movie anime">
          <label class="rec-field" data-kinds="movie anime">
            <span>评分（0-10）</span>
            <input id="recRating" type="number" min="0" max="10" step="0.1">
          </label>
          <label class="rec-field" data-kinds="movie anime">
            <span>年份</span>
            <input id="recYear" type="number" min="1800" max="2200" step="1">
          </label>
        </div>

        <label class="rec-field" data-kinds="site tool movie anime">
          <span>说明</span>
          <textarea id="recDescription" rows="4" maxlength="2000" placeholder="推荐理由、适用场景或简单介绍"></textarea>
        </label>

        <div class="rec-cover-field">
          <div class="rec-cover-preview" id="recCoverPreview">
            <i data-lucide="image-plus"></i>
          </div>
          <div class="rec-cover-controls">
            <strong>封面 / 截图</strong>
            <span id="recCoverHint">网站建议 16:9，电影和动漫建议 2:3，最大 15MB。</span>
            <div>
              <button class="rec-action" id="recPickCover" type="button">选择图片</button>
              <button class="rec-action" id="recClearCover" type="button" hidden>移除封面</button>
            </div>
          </div>
          <input id="recCoverInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
        </div>

        <label class="rec-check">
          <input id="recPinned" type="checkbox">
          <span>置顶推荐</span>
        </label>

        <div class="rec-form-error" id="recFormError" hidden></div>
        <div class="rec-dialog-actions">
          <button class="rec-action" id="recCancel" type="button">取消</button>
          <button class="rec-action primary" id="recSave" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="rec-picker" id="recBookmarkPicker" hidden>
    <div class="rec-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="recBookmarkPickerTitle">
      <div class="rec-picker-head">
        <div>
          <h2 id="recBookmarkPickerTitle">选择书签</h2>
          <p>关联后推荐页会跟随收藏的标题、网址和图标。</p>
        </div>
        <button class="rec-dialog-close" id="recBookmarkPickerClose" type="button" aria-label="关闭">×</button>
      </div>
      <label class="rec-search rec-picker-search">
        <i data-lucide="search"></i>
        <input id="recBookmarkSearch" type="search" placeholder="搜索收藏标题、网址或说明">
      </label>
      <div class="rec-bookmark-body">
        <div class="rec-bookmark-list" id="recBookmarkList"></div>
        <div class="rec-empty rec-bookmark-empty" id="recBookmarkEmpty" hidden>没有匹配的书签。</div>
      </div>
    </div>
  </div>

  <div class="rec-toast" id="recToast" hidden></div>

  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/site/rain.js"></script>
  <script src="/static/site/dialog.js"></script>
  <script src="/static/site/upload-limits.js"></script>
  <script src="/static/site/report.js"></script>
  <script src="/static/site/inertia-scroll.js"></script>
  <script src="/static/site/back-to-top.js"></script>
  <script src="/static/site/focus-target.js"></script>
  <script src="/static/site/fresh-cards.js"></script>
  <script src="/static/site/dropzone.js"></script>
  <script src="/static/site/notify-seen.js"></script>
  <script src="/static/recommendations.js"></script>
  <script>window.ERRORJ_JUMP = { label: "推荐" };</script>
  <script src="/static/site/fresh-jump.js"></script>

</body>
</html>
