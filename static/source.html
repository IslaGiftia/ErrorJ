<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <title>源码 · Error酱</title>
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=3">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=3">
  <link rel="stylesheet" href="/static/site/site.css">
  <link rel="stylesheet" href="/static/site/rain.css">
  <style>
    .source-page {
      position: relative;
      z-index: 1;
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 96px 20px 64px;
      text-align: center;
    }

    .source-page h1 {
      margin: 0 0 16px;
      font-size: 42px;
      line-height: 1.2;
    }

    .source-page p {
      margin: 0 auto 12px;
      max-width: 620px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.85;
    }

    .source-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      box-shadow: var(--shadow);
      font-weight: 700;
    }

    .source-back {
      display: flex;
      justify-content: center;
      margin-top: 34px;
    }

    @media (max-width: 720px) {
      .source-page {
        padding-top: 72px;
      }

      .source-page h1 {
        font-size: 32px;
      }
    }
  </style>
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
</head>
<body>
  <div class="rain-scene rain-scene--fixed" id="rainScene" aria-hidden="true">
    <div class="rain-layer" id="rainLayer"></div>
    <div class="rain-floor" id="rainFloor"></div>
  </div>

  <main class="source-page">
    <h1>Error酱源码</h1>
    <p>Error酱全部由 ChatGPT 和 DeepSeek 协助完成，没有原创，大部分功能是搬运并组合开源项目。</p>
    <p>仓库还在整理中，等清理完密钥、数据和示例截图就会公开。</p>
    <div class="source-note">🔧 开源筹备中，GitHub 地址待填写</div>

    <div class="source-back">
      <a class="repo-entry" href="/" data-back data-back-parent="/">
        <span class="repo-entry-label">
          <span class="repo-entry-text">返回Error酱首页</span>
        </span>
      </a>
    </div>
  </main>

  <script src="/static/site/rain.js"></script>
  <script>
    (function () {
      var preference = "auto";
      try {
        preference = localStorage.getItem("errorSiteTheme") || "auto";
      } catch (err) {}

      function applyTheme(next) {
        preference = next;
        var dark = next === "dark" ||
          (next === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      }

      applyTheme(preference);
    })();
  </script>
<script src="/static/site/back-link.js"></script>
</body>
</html>
