<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <title>给Error酱留言</title>
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=3">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=3">
  <link rel="stylesheet" href="/static/messages.css">
  <link rel="stylesheet" href="/static/site/rain.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/site/minimap.css">
</head>
<body>
  <div class="rain-scene rain-scene--fixed" id="rainScene" aria-hidden="true">
    <div class="rain-layer" id="rainLayer"></div>
    <div class="rain-floor" id="rainFloor"></div>
  </div>

  <header class="mg-header">
    <a class="mg-brand" href="/">
      <span class="mg-brand-icon"><i data-lucide="message-square-heart"></i></span>
      <strong>留言板</strong>
    </a>
    <div class="mg-header-actions">
      <span class="mg-count" id="messageCount"></span>
    </div>
  </header>

  <div class="mg-app">
    <main class="mg-main">
      <section class="mg-panel" id="messageComposerPanel" hidden>
        <h1>给 Error酱 留言</h1>
        <p class="mg-hint">文字、附件都行。单条最多 3 个附件，单个不超过 5MB；支持图片、PDF、文本，附件需要审核通过后其他人才能看到。</p>
        <form id="messageForm">
          <div class="mg-field">
            <label for="msgContent">内容</label>
            <textarea id="msgContent" maxlength="1000" placeholder="想说的话，也可以直接把截图粘贴进来…"></textarea>
          </div>
          <div class="mg-compose-row">
            <button class="mg-btn mg-btn-ghost" id="pickFileBtn" type="button">
              <i data-lucide="paperclip"></i><span>添加附件</span>
            </button>
            <span class="mg-attach-hint" id="attachHint">支持图片、PDF、TXT、MD（附件会先送审核）</span>
          </div>
          <input type="file" id="fileInput" multiple hidden>
          <ul class="mg-file-list" id="pendingList"></ul>
          <label class="mg-region-toggle">
            <input type="checkbox" id="msgShowRegion" checked>
            <span>公开 IP 属地（仅到省份，例如「广东」；完整 IP 不会对外显示）</span>
          </label>
          <div class="mg-actions">
            <button class="mg-btn mg-btn-primary mg-send-btn" id="submitBtn" type="submit">
              <i data-lucide="send"></i><span>发布留言</span>
            </button>
          </div>
          <p class="mg-quota" id="messageQuota" hidden></p>
        </form>
      </section>

      <section class="mg-list" id="messageList"></section>
    </main>
  </div>

  <div class="mg-toast" id="toast" hidden></div>

  <div class="mg-viewer" id="fileViewer" hidden>
    <div class="mg-viewer-dialog" role="dialog" aria-modal="true" aria-labelledby="fileViewerTitle">
      <header class="mg-viewer-head">
        <strong id="fileViewerTitle">查看</strong>
        <button class="mg-icon-btn" id="fileViewerClose" type="button" aria-label="关闭">
          <i data-lucide="x"></i>
        </button>
      </header>
      <div class="mg-viewer-body" id="fileViewerBody"></div>
    </div>
  </div>

  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/site/rain.js"></script>
  <script src="/static/messages.js"></script>

  <div class="dock-hud" id="dockHud" aria-hidden="true">
    <span class="dock-hud-label">PING</span>
    <span class="dock-hud-value" id="hudPing">--</span>
    <span class="dock-hud-label">FPS</span>
    <span class="dock-hud-value" id="hudFps">--</span>
  </div>
  <a class="map-dock" id="mapDock" href="/map" aria-label="打开 Error酱地图" title="Error酱地图">
    <span class="map-dock-mini" id="mapDockMini" aria-hidden="true"></span>
    <span class="map-dock-grid" aria-hidden="true"></span>
    <span class="map-dock-cross" aria-hidden="true"></span>
    <span class="map-dock-north" aria-hidden="true">N</span>
    <span class="map-dock-ring" aria-hidden="true"></span>
    <span class="map-dock-count" id="mapDockCount" hidden>地图</span>
  </a>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/site/minimap.js"></script>
  <script src="/static/site/hud.js"></script>
</body>
</html>
