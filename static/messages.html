<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <title>留言</title>
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=4">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=4">
  <link rel="stylesheet" href="/static/messages.css">
  <link rel="stylesheet" href="/static/site/rain.css">
  <link rel="stylesheet" href="/static/site/progress.css">
  <link rel="stylesheet" href="/static/site/report.css">
  <link rel="stylesheet" href="/static/site/dropzone.css">
  <link rel="stylesheet" href="/static/site/sidebar.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
  <link rel="stylesheet" href="/static/fonts.css">
</head>
<body data-notify-module="messages">
  <div class="rain-scene rain-scene--fixed" id="rainScene" aria-hidden="true">
    <div class="rain-layer" id="rainLayer"></div>
    <div class="rain-floor" id="rainFloor"></div>
  </div>

  <!--
    三栏外壳：左栏 - 留言内容列（.mg-app 仍是 760px，宽度不变）- 右栏。
    窄屏（<1280px）左右栏整体不显示，只剩中间的内容流。
  -->
  <div class="sb-shell">
    <aside class="sb-side sb-side--left" id="sidebarLeft" aria-label="站点信息"></aside>

  <div class="mg-app">
    <main class="mg-main">
      <section class="mg-panel" id="messageComposerPanel" hidden>
        <h1>留言</h1>
        <p class="mg-hint" id="messageUploadHint">文字、附件都行。单条最多 3 个附件，单个不超过 5MB；整条留言需要管理员审核通过后其他人才能看到。</p>
        <form id="messageForm">
          <div class="mg-field">
            <label for="msgContent">内容</label>
            <textarea id="msgContent" maxlength="1000" placeholder="想说的话，也可以直接把截图粘贴进来…"></textarea>
          </div>
          <input type="file" id="fileInput" multiple hidden>
          <!--
            底部一行：左边两个勾选项（IP属地 / 设备平台），今日额度用 margin-left:auto 靠右，
            右边缘和上面「发布留言」按钮对齐。
          -->
          <div class="mg-compose-row">
            <button class="mg-btn mg-btn-ghost" id="pickFileBtn" type="button">
              <i data-lucide="paperclip"></i><span>添加附件</span>
            </button>
            <span class="mg-attach-hint" id="attachHint">支持图片、PDF、TXT、MD（附件会先送审核）</span>
            <button class="mg-btn mg-btn-primary mg-send-btn" id="submitBtn" type="submit">
              <i data-lucide="send"></i><span>发布留言</span>
            </button>
          </div>
          <ul class="mg-file-list" id="pendingList"></ul>
          <div class="mg-compose-row mg-compose-meta">
            <label class="mg-region-toggle">
              <input type="checkbox" id="msgShowRegion">
              <span>IP属地</span>
            </label>
            <!-- 设备平台：勾了才公开这一条的设备来源；管理员还能在右边填一个自定义名称 -->
            <label class="mg-region-toggle mg-device-toggle">
              <input type="checkbox" id="msgShowDevice">
              <span>设备平台</span>
            </label>
            <!-- 自定义名称只有管理员看得到 -->
            <div class="mg-device-field" id="msgDeviceField" hidden>
              <input class="mg-device-input" id="msgDeviceInput" type="text" maxlength="40"
                     placeholder="例如 iQOO 12 Pro">
            </div>
            <p class="mg-quota" id="messageQuota" hidden></p>
          </div>
        </form>
      </section>

      <!--
        筛选：常驻悬浮的下拉按钮，滚到哪儿都停在内容区左上角；四个选项对应原来的四个胶囊。
      -->
      <div class="mg-filter-dock" id="messageFilter" hidden>
        <button class="mg-filter-btn" id="messageFilterBtn" type="button"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="messageFilterMenu">
          <span class="mg-filter-label" id="messageFilterLabel">全部留言</span>
          <i data-lucide="chevron-down" aria-hidden="true"></i>
        </button>
        <!-- 编辑框滚出上方后才渐显；点它平滑回到顶部并聚焦输入框 -->
        <button class="mg-filter-btn mg-send-float" id="messageSendBtn" type="button"
                aria-label="发送留言" aria-hidden="true" tabindex="-1">
          <i data-lucide="send" aria-hidden="true"></i>
          <span>发送留言</span>
        </button>
        <div class="mg-filter-menu" id="messageFilterMenu" role="listbox" aria-label="留言筛选" hidden>
          <button class="mg-filter-option is-active" type="button" role="option" aria-selected="true" data-mg-filter="all">
            <span class="mg-filter-option-label">全部留言</span>
            <span class="mg-filter-check" aria-hidden="true"><i data-lucide="check"></i></span>
          </button>
          <button class="mg-filter-option" type="button" role="option" aria-selected="false" data-mg-filter="mine">
            <span class="mg-filter-option-label">我的</span>
            <span class="mg-filter-check" aria-hidden="true"><i data-lucide="check"></i></span>
          </button>
          <button class="mg-filter-option" type="button" role="option" aria-selected="false" data-mg-filter="replied">
            <span class="mg-filter-option-label">评论</span>
            <span class="mg-filter-check" aria-hidden="true"><i data-lucide="check"></i></span>
          </button>
          <button class="mg-filter-option" type="button" role="option" aria-selected="false" data-mg-filter="liked">
            <span class="mg-filter-option-label">点赞</span>
            <span class="mg-filter-check" aria-hidden="true"><i data-lucide="check"></i></span>
          </button>
        </div>
      </div>
      <section class="mg-list" id="messageList"></section>
    </main>
  </div>

    <aside class="sb-side sb-side--right" id="sidebarRight" aria-label="站内资源与活动"></aside>
  </div>

  <div class="mg-toast" id="toast" hidden></div>

  <!--
    附件查看器：图片走「灯箱」模式（原图独占屏幕、左右切换、无白框），
    非图片附件仍走原来的白色弹窗 + iframe 预览。
  -->
  <div class="mg-viewer" id="fileViewer" hidden>
    <div class="mg-viewer-gallery" id="fileViewerGallery" role="dialog" aria-modal="true"
         aria-label="图片查看" hidden>
      <div class="mg-viewer-stage" id="fileViewerStage"></div>
      <button class="mg-viewer-nav is-prev" id="fileViewerPrev" type="button" aria-label="上一张">
        <i data-lucide="chevron-left"></i>
      </button>
      <button class="mg-viewer-nav is-next" id="fileViewerNext" type="button" aria-label="下一张">
        <i data-lucide="chevron-right"></i>
      </button>
      <span class="mg-viewer-counter" id="fileViewerCounter" hidden></span>
      <button class="mg-viewer-close" id="fileViewerCloseImg" type="button" aria-label="关闭">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="mg-viewer-dialog" id="fileViewerDialog" role="dialog" aria-modal="true"
         aria-labelledby="fileViewerTitle" hidden>
      <header class="mg-viewer-head">
        <strong id="fileViewerTitle">查看</strong>
        <button class="mg-icon-btn" id="fileViewerClose" type="button" aria-label="关闭">
          <i data-lucide="x"></i>
        </button>
      </header>
      <div class="mg-viewer-body" id="fileViewerBody"></div>
    </div>
  </div>

  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/site/rain.js"></script>
  <script src="/static/site/progress.js"></script>
  <script src="/static/site/upload-limits.js"></script>
  <script src="/static/site/dialog.js"></script>
  <script src="/static/site/report.js"></script>
  <script src="/static/site/inertia-scroll.js"></script>
  <script src="/static/site/back-to-top.js"></script>
  <script src="/static/site/dropzone.js"></script>
  <script src="/static/site/image-zoom.js"></script>
  <script src="/static/site/fresh-visibility.js"></script>
  <script src="/static/site/relative-time.js"></script>
  <script src="/static/site/sidebar.js"></script>
  <script src="/static/messages.js"></script>

</body>
</html>
