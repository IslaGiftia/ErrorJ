<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <meta name="tab-name" content="ej-moments">
  <title>动态</title>
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=4">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=4">
  <link rel="stylesheet" href="/static/moments.css">
  <link rel="stylesheet" href="/static/site/rain.css">
  <link rel="stylesheet" href="/static/site/progress.css">
  <link rel="stylesheet" href="/static/site/report.css">
  <link rel="stylesheet" href="/static/site/dropzone.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
  <script src="/static/site/tabname.js"></script>
  <link rel="stylesheet" href="/static/fonts.css">
</head>
<body data-notify-module="moments">
  <div class="rain-scene rain-scene--fixed" id="rainScene" aria-hidden="true">
    <div class="rain-layer" id="rainLayer"></div>
    <div class="rain-floor" id="rainFloor"></div>
  </div>

  <div class="mo-app">
    <main class="mo-main">
      <form class="mo-card mo-composer" id="momentForm" hidden>
        <textarea id="momentContent" maxlength="2000" placeholder="今天在折腾什么？记录一句，或者直接粘贴截图…"></textarea>
        <div class="mo-tag-input">
          <input id="momentTags" maxlength="200" placeholder="标签（可选，用逗号分隔，例如：单片机, 折腾记录）">
        </div>
        <ul class="mo-pending" id="pendingList"></ul>
        <div class="mo-composer-foot">
          <button class="mo-btn mo-btn-ghost" id="pickImageBtn" type="button">
            <i data-lucide="image-plus"></i><span>配图</span>
          </button>
          <span class="mo-hint" id="imageHint">最多 9 张，单张 5MB</span>
          <button class="mo-btn mo-btn-primary" id="submitBtn" type="submit">
            <i data-lucide="send"></i><span>发布</span>
          </button>
        </div>
        <div class="mo-composer-meta">
          <label class="mo-region-toggle">
            <input type="checkbox" id="momentShowRegion">
            <span>IP属地</span>
          </label>
          <!-- 设备平台（只有管理员看得到）：勾选后用自定义名称，留空或没勾选就按 UA 自动识别 -->
          <div class="mo-device-field" id="momentDeviceField" hidden>
            <label class="mo-device-toggle">
              <input type="checkbox" id="momentUseDevice">
              <span>设备平台</span>
            </label>
            <input class="mo-device-input" id="momentDeviceInput" type="text" maxlength="40"
                   placeholder="例如 iQOO 12 Pro">
          </div>
        </div>
        <input type="file" id="imageInput" accept="image/*" multiple hidden>
      </form>

      <!--
        悬浮操作区：夹在「动态编辑区」和「动态卡片」中间（位置和留言页的「全部动态」一致）。
        从左到右：栏位切换（我的动态 / 开发日志，只留图标）、筛选下拉、「写动态」；
        四个按钮统一高度（和留言页 .mg-filter-btn 一致）、同一行靠左，右上角不再有数字角标，
        悬停提示改走 .mo-tip；「写动态」和留言页的「发送留言」一样，编辑框滚出视野上方才渐显。
      -->
      <div class="mo-dock" id="momentDock" hidden>
        <div class="mo-kind-switch" id="momentKinds" role="group" aria-label="动态分类">
          <button class="mo-filter-btn mo-kind-btn mo-tip is-active" type="button" data-mo-kind="post"
                  aria-pressed="true" aria-label="我的动态" data-tip="我的动态">
            <i data-lucide="message-square" aria-hidden="true"></i>
          </button>
          <button class="mo-filter-btn mo-kind-btn mo-tip" type="button" data-mo-kind="log"
                  aria-pressed="false" aria-label="开发日志" data-tip="开发日志">
            <i data-lucide="git-commit-vertical" aria-hidden="true"></i>
          </button>
        </div>
        <div class="mo-filter-wrap" id="momentFilterWrap">
          <button class="mo-filter-btn" id="momentFilterBtn" type="button"
                  aria-haspopup="listbox" aria-expanded="false" aria-controls="momentFilterMenu">
            <span class="mo-filter-label" id="momentFilterLabel">全部动态</span>
            <i data-lucide="chevron-down" aria-hidden="true"></i>
          </button>
          <div class="mo-filter-menu" id="momentFilterMenu" role="listbox" aria-label="动态筛选" hidden>
            <button class="mo-filter-option is-active" type="button" role="option" aria-selected="true" data-mo-filter="all">
              <span class="mo-filter-option-label">全部动态</span>
              <span class="mo-filter-check" aria-hidden="true"><i data-lucide="check"></i></span>
            </button>
            <button class="mo-filter-option" type="button" role="option" aria-selected="false" data-mo-filter="share">
              <span class="mo-filter-option-label">分享</span>
              <span class="mo-filter-check" aria-hidden="true"><i data-lucide="check"></i></span>
            </button>
            <button class="mo-filter-option" type="button" role="option" aria-selected="false" data-mo-filter="commented">
              <span class="mo-filter-option-label">评论</span>
              <span class="mo-filter-check" aria-hidden="true"><i data-lucide="check"></i></span>
            </button>
            <button class="mo-filter-option" type="button" role="option" aria-selected="false" data-mo-filter="liked">
              <span class="mo-filter-option-label">点赞</span>
              <span class="mo-filter-check" aria-hidden="true"><i data-lucide="check"></i></span>
            </button>
          </div>
        </div>
        <button class="mo-filter-btn mo-send-float" id="momentSendBtn" type="button"
                aria-label="写动态" aria-hidden="true" tabindex="-1">
          <i data-lucide="send" aria-hidden="true"></i>
          <span>写动态</span>
        </button>
      </div>

      <section class="mo-list" id="momentList"></section>
    </main>
  </div>

  <div class="mo-toast" id="toast" hidden></div>

  <!-- 图片灯箱（和留言页同一套）：原图独占屏幕、无白框、左右切换 -->
  <div class="mo-viewer" id="momentViewer" role="dialog" aria-modal="true" aria-label="查看图片" hidden>
    <div class="mo-viewer-stage" id="momentViewerStage"></div>
    <button class="mo-viewer-nav is-prev" id="momentViewerPrev" type="button" aria-label="上一张">
      <i data-lucide="chevron-left"></i>
    </button>
    <button class="mo-viewer-nav is-next" id="momentViewerNext" type="button" aria-label="下一张">
      <i data-lucide="chevron-right"></i>
    </button>
    <span class="mo-viewer-counter" id="momentViewerCounter" hidden></span>
    <button class="mo-viewer-close" id="momentViewerClose" type="button" aria-label="关闭">
      <i data-lucide="x"></i>
    </button>
  </div>

  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/site/rain.js"></script>
  <script src="/static/site/progress.js"></script>
  <script src="/static/site/upload-limits.js"></script>
  <script src="/static/site/dialog.js"></script>
  <script src="/static/site/report.js"></script>
  <script src="/static/site/back-to-top.js"></script>
  <script src="/static/site/dropzone.js"></script>
  <script src="/static/site/image-zoom.js"></script>
  <script src="/static/site/notify-seen.js"></script>
  <script src="/static/moments.js"></script>
  <!-- 分享卡的播放键要和歌曲播放页一样做 play↔pause 形变，复用同一个适配层 -->
  <script type="module" src="/static/site/morph-icons.js"></script>

</body>
</html>
