<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <meta name="tab-name" content="ej-files">
  <title>文件</title>
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=4">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=4">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
  <script src="/static/site/tabname.js"></script>
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/site/progress.css">
  <link rel="stylesheet" href="/static/site/share.css">
  <link rel="stylesheet" href="/static/files.css">
  <link rel="stylesheet" href="/static/site/embed.css">
  <script src="/static/site/embed.js"></script>
</head>
<body data-notify-module="files">
  <header class="fl-top">
    <div class="fl-top-inner">
      <a class="fl-brand" href="/">
        <i data-lucide="arrow-left"></i>
        <strong>文件</strong>
      </a>
      <span class="fl-count" id="fileCount"></span>
      <button class="fl-btn fl-btn-primary" id="fileUploadBtn" type="button" hidden>
        <i data-lucide="plus"></i><span>文件</span>
      </button>
    </div>
  </header>

  <main class="fl-main">
    <div class="fl-list" id="fileList" aria-live="polite"></div>
  </main>

  <div class="fl-modal" id="uploadModal" hidden>
    <div class="fl-dialog" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
      <header class="fl-dialog-head">
        <h2 id="uploadTitle">上传文件</h2>
        <button class="fl-icon-btn" id="uploadClose" type="button" aria-label="关闭">
          <i data-lucide="x"></i>
        </button>
      </header>
      <label class="fl-file-field">
        <input id="uploadFiles" type="file">
        <span><i data-lucide="file-up"></i><strong id="uploadFileLabel">选择文件</strong></span>
        <small>支持源码压缩包、HEX、BIN、APK、EXE、PDF、原理图、图片等，单个不超过 30MB。</small>
      </label>
      <label class="fl-field"><span>标题（可留空）</span><input id="uploadName" maxlength="160" placeholder="默认使用文件名"></label>
      <label class="fl-field"><span>分类</span>
        <select id="uploadCategory">
          <option value="other">其他</option>
          <option value="source">源码与工程</option>
          <option value="firmware">固件</option>
          <option value="document">文档</option>
          <option value="image">图片</option>
        </select>
      </label>
      <p class="fl-hint" id="uploadHint">上传后直接出现在这个页面，登录账号可以下载。</p>
      <div class="fl-dialog-actions">
        <span class="fl-spacer"></span>
        <button class="fl-btn" id="uploadCancel" type="button">取消</button>
        <button class="fl-btn fl-btn-primary" id="uploadSubmit" type="button">开始上传</button>
      </div>
    </div>
  </div>

  <div class="fl-toast" id="fileToast" hidden></div>

  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/site/progress.js"></script>
  <script src="/static/site/share.js"></script>
  <script src="/static/site/upload-limits.js"></script>
  <script src="/static/site/focus-target.js"></script>
  <script src="/static/files.js"></script>
</body>
</html>
