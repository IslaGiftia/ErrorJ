<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <meta name="tab-name" content="ej-recommend">
  <title>推荐</title>
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=4">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=4">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
  <script src="/static/site/tabname.js"></script>
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/site/rain.css">
  <link rel="stylesheet" href="/static/downloads.css">
</head>
<body>
  <div class="rain-scene rain-scene--fixed" id="rainScene" aria-hidden="true">
    <div class="rain-layer" id="rainLayer"></div>
    <div class="rain-floor" id="rainFloor"></div>
  </div>

  <div class="dl-app">
    <!--
      悬浮操作区（整条顶部导航栏已删除，子页面铺满整个窗口）：
      左上角是四个子页面的纯图标按钮（大小 / 位置严格对齐留言、动态页的悬浮按钮，悬停显示提示文字），
      右上角是随子页渐入渐出的「新增」按钮（上传图标 + 歌曲 / 书籍 / 网页 / 站内）。
    -->
    <div class="dl-dock">
      <div class="dl-tabs" id="dlTabs" role="group" aria-label="推荐分类">
        <button class="dl-tab dl-tip is-active" type="button" data-tab="music" data-tip="歌曲" aria-label="歌曲" aria-pressed="true">
          <i data-lucide="music"></i>
          <em class="dl-tab-badge" hidden></em>
        </button>
        <button class="dl-tab dl-tip" type="button" data-tab="books" data-tip="书籍" aria-label="书籍" aria-pressed="false">
          <i data-lucide="book-open"></i>
          <em class="dl-tab-badge" hidden></em>
        </button>
        <button class="dl-tab dl-tip" type="button" data-tab="web" data-tip="网页" aria-label="网页" aria-pressed="false">
          <i data-lucide="globe"></i>
          <em class="dl-tab-badge" hidden></em>
        </button>
        <button class="dl-tab dl-tip" type="button" data-tab="resource" data-tip="站内资源" aria-label="站内资源" aria-pressed="false">
          <i data-lucide="layers"></i>
        </button>
      </div>

      <button class="dl-action" id="dlAction" type="button" hidden>
        <i data-lucide="upload"></i>
        <span class="dl-action-label" id="dlActionLabel">歌曲</span>
      </button>
    </div>

    <div class="dl-stage" id="dlStage">
      <section class="dl-panel is-active" data-panel="music" aria-label="歌曲">
        <iframe class="dl-frame" data-frame="music" title="歌曲" src="/music?embed=1"></iframe>
      </section>
      <section class="dl-panel" data-panel="books" aria-label="书籍">
        <iframe class="dl-frame" data-frame="books" title="书籍" src="/books?embed=1"></iframe>
      </section>
      <section class="dl-panel" data-panel="web" aria-label="网页">
        <iframe class="dl-frame" data-frame="web" title="网页" src="/recommendations?embed=1&view=web"></iframe>
      </section>
      <section class="dl-panel" data-panel="resource" aria-label="站内资源">
        <iframe class="dl-frame" data-frame="resource" title="站内资源" src="/recommendations?embed=1&view=resource"></iframe>
      </section>
    </div>
  </div>

  <script src="/static/vendor/lucide.min.js"></script>
  <script src="/static/site/rain.js"></script>
  <script src="/static/downloads.js"></script>
</body>
</html>
