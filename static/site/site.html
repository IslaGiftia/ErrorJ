<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b68ee">
  <title>Error酱</title>
  <link rel="icon" type="image/png" href="/static/site/error-chan-favicon.png?v=3">
  <link rel="apple-touch-icon" href="/static/site/error-chan-touch.png?v=3">
<link rel="stylesheet" href="/static/site/site.css">
<link rel="stylesheet" href="/static/site/rain.css">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/site/minimap.css">
<link rel="stylesheet" href="/static/site/activity.css">
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("errorSiteTheme") || "auto";
        var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (err) {}
    })();
  </script>
  <script src="/static/site/theme.js"></script>
<link rel="stylesheet" href="/static/fonts.css">
</head>
<body data-page="home">
  <div class="home-controls">
    <button class="auth-status-btn" id="authStatusBtn" type="button" aria-haspopup="dialog">
      <span class="auth-status-dot" id="authStatusDot"></span>
      <span id="authStatusText">游客</span>
    </button>
    <button class="theme-float icon-btn" id="themeToggle" aria-label="切换外观" title="外观：跟随系统">
      <span class="theme-glyph" id="themeGlyph">◑</span>
    </button>
  </div>

  <div class="auth-menu" id="authMenu" hidden>
    <strong id="authMenuUser">已登录</strong>
    <button type="button" id="nicknameBtn" hidden>修改昵称</button>
    <button type="button" id="logoutBtn">退出登录</button>
  </div>

  <div class="dock-hud" id="dockHud" aria-hidden="true">
    <span class="dock-hud-label">PING</span>
    <span class="dock-hud-value" id="hudPing">--</span>
    <span class="dock-hud-label">FPS</span>
    <span class="dock-hud-value" id="hudFps">--</span>
  </div>

  <a class="map-dock" id="mapDock" href="/map" aria-label="打开足迹" title="足迹">
    <span class="map-dock-mini" id="mapDockMini" aria-hidden="true"></span>
    <span class="map-dock-tint" aria-hidden="true"></span>
    <span class="map-dock-cross" aria-hidden="true"></span>
    <span class="map-dock-ring" aria-hidden="true"></span>
    <span class="map-dock-count" id="mapDockCount" hidden>足迹</span>
  </a>

  <aside class="activity-panel" id="activityPanel" aria-label="首页动态" title="单击展开，双击隐藏" hidden>
    <div class="activity-feed" id="activityFeed">
      <div class="activity-feed-track" id="activityFeedTrack"></div>
    </div>
  </aside>

  <main class="landing landing-three rain-scene" id="rainScene">
    <div class="rain-layer" id="rainLayer" aria-hidden="true"></div>
    <div class="landing-inner">
      <div class="landing-main">
        <h1 class="landing-title"><span id="landingTitleText">使用Error酱工作和学习</span></h1>
        <p class="landing-desc" id="landingDesc">Error酱是一个学习平台，她由Codex和DeepSeek完成，参考了很多优秀项目。当然，Error酱也是开源的</p>

        <div class="repo-grid">
          <a class="repo-entry" href="/inventory" target="ej-inventory" data-private-module="inventory">
            <span class="repo-entry-label">
              <span class="repo-entry-text">📦<span id="repoCount">仓库</span></span>
            </span>
            <span class="repo-thumbs" id="repoThumbs"></span>
          </a>

          <a class="repo-entry" href="/bookmarks" target="ej-bookmarks" data-private-module="bookmarks">
            <span class="repo-entry-label">
              <span class="repo-entry-text">🔖<span id="bookmarkCount">书签</span></span>
            </span>
            <span class="repo-thumbs" id="bookmarkThumbs"></span>
          </a>

          <a class="repo-entry" href="/notes" target="ej-notes" data-private-module="notes">
            <span class="repo-entry-label">
              <span class="repo-entry-text">📝<span id="noteCount">笔记</span></span>
            </span>
            <span class="repo-thumbs" id="notesThumbs"></span>
          </a>

          <a class="repo-entry" href="/workbench" target="ej-workbench" data-private-module="workbench">
            <span class="repo-pending" id="workbenchPending" hidden></span>
            <span class="repo-entry-label">
              <span class="repo-entry-text">🧰<span id="workbenchCount">工作台</span></span>
            </span>
            <span class="repo-thumbs" id="workbenchThumbs" aria-hidden="true"></span>
          </a>
        </div>

        <div class="landing-module-actions" aria-label="工作台功能入口">
          <a class="landing-module-btn" href="/messages" id="messagesEntry" data-guest-page="guest:page:messages">
            <span class="landing-module-text">留言</span>
            <em class="landing-module-badge" id="messagesPending" hidden></em>
          </a>
          <a class="landing-module-btn" href="/games" data-guest-page="guest:page:games"><span class="landing-module-text">游戏</span></a>
          <a class="landing-module-btn" href="/music" data-guest-page="guest:page:music"><span class="landing-module-text">歌单</span></a>
          <a class="landing-module-btn" href="/books" data-guest-page="guest:page:books"><span class="landing-module-text">书架</span></a>
          <a class="landing-module-btn" href="/moments" id="momentsEntry" data-guest-page="guest:page:moments">
            <span class="landing-module-text">动态</span>
            <em class="landing-module-badge" id="momentsPending" hidden></em>
          </a>
          <a class="landing-module-btn" href="/recommendations" data-guest-page="guest:page:recommendations"><span class="landing-module-text">推荐</span></a>
        </div>

        <nav class="landing-links" aria-label="项目相关链接">
          <a href="/references" data-guest-page="guest:page:references">参考项目</a>
          <a href="https://github.com/IslaGiftia/ErrorJ" target="_blank" rel="noopener noreferrer">Error酱源码</a>
        </nav>
      </div>

      <p class="landing-footer"><strong>时光流转，愿你与珍爱之人，能够再次重逢。</strong></p>
      <div class="landing-credit-block">
        <p class="landing-font-credit">网页字体为 vivo Sans</p>
        <p class="landing-record"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">陕ICP备2026028018号-1</a></p>
      </div>
    </div>
    <div class="rain-floor" id="rainFloor" aria-hidden="true"></div>
  </main>

  <div class="auth-modal" id="authModal" hidden>
    <div class="auth-dialog" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <button class="auth-close" id="authClose" type="button" aria-label="关闭">×</button>
      <h2 id="authTitle">登录 Error酱</h2>
      <form id="authForm">
        <label class="auth-field">
          <span>用户名</span>
          <input id="authUsername" type="text" autocomplete="username" placeholder="管理员可留空">
        </label>
        <label class="auth-field">
          <span>访问密码</span>
          <input id="authPassword" type="password" autocomplete="current-password" required>
        </label>
        <label class="auth-remember">
          <input id="authRemember" type="checkbox">
          <span>记住我（30 天）</span>
        </label>
        <button class="auth-submit" id="authSubmit" type="submit">登录</button>
        <div class="auth-error" id="authError" hidden></div>
      </form>
      <a class="auth-register-link" href="/register">还没有账号？申请注册</a>
    </div>
  </div>

  <div class="landing-toast" id="landingToast" hidden></div>

  <div class="auth-modal" id="nicknameModal" hidden>
    <div class="auth-dialog" role="dialog" aria-modal="true" aria-labelledby="nicknameTitle">
      <button class="auth-close" id="nicknameClose" type="button" aria-label="关闭">×</button>
      <h2 id="nicknameTitle">修改昵称</h2>
      <p>2-16 位，支持中英文、数字和常见符号；昵称唯一，每 30 天可修改一次。</p>
      <form id="nicknameForm">
        <label class="auth-field">
          <span>新昵称</span>
          <input id="nicknameInput" type="text" maxlength="16" minlength="2" autocomplete="nickname" required>
        </label>
        <button class="auth-submit" id="nicknameSubmit" type="submit">保存</button>
        <div class="auth-error" id="nicknameError" hidden></div>
      </form>
    </div>
  </div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/site/minimap.js"></script>
<script src="/static/site/hud.js"></script>
<script src="/static/site/activity.js"></script>
<script src="/static/site/rain.js"></script>
<script src="/static/site/site.js"></script>
</body>
</html>
