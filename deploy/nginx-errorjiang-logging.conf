# 放在 /etc/nginx/conf.d/errorjiang-logging.conf（http 上下文）。
# 该格式记录源 IP、源端口、目标主机、目标端口、方法、结果和 User-Agent。
log_format errorjiang_log
    '$remote_addr:$remote_port - $remote_user [$time_local] '
    '"$request_method $scheme://$host$request_uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'host="$host" server_port="$server_port"';

access_log /var/log/nginx/errorjiang.access.log errorjiang_log;
error_log /var/log/nginx/errorjiang.error.log warn;
