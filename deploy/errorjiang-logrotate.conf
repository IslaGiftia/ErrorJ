# 安装为 /etc/logrotate.d/errorjiang
# 网络访问和错误日志至少保留 180 天，与《网络安全法》要求一致。
/var/log/nginx/errorjiang.access.log
/var/log/nginx/errorjiang.error.log {
    daily
    rotate 180
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        [ -f /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)" 2>/dev/null || true
    endscript
}
