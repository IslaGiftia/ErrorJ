# Error酱 管理员入口白名单（开关 + IP 列表）
# 安装位置：/etc/nginx/conf.d/errorjiang-admin-allow.conf
# 该文件在 http 上下文被加载（conf.d/*.conf），提供两个变量：
#   $errorjiang_admin_ok  1 = 允许访问管理员入口，0 = 返回 403
#   $errorjiang_real_ip   真实客户端 IP，用于反代转发和访问日志
#
# 两种模式，改 default 一个数字即可（配合 deploy/nginx-errorjiang.conf 里的 if 判断）：
#   default 1  ->  白名单关闭：任意 IP 都能访问管理员入口（当前状态）
#   default 0  ->  白名单开启：只有下面列出的 IP / 网段能访问
#
# 推荐用脚本改，别手改（脚本会先 nginx -t 再 reload，失败自动回滚）：
#   sudo bash deploy/nginx-allow-ip.sh list            # 看当前模式和白名单
#   sudo bash deploy/nginx-allow-ip.sh open            # 关闭白名单（任意网络可登录）
#   sudo bash deploy/nginx-allow-ip.sh strict          # 开启白名单
#   sudo bash deploy/nginx-allow-ip.sh add 1.2.3.4     # 加一个 IP / 网段
#   sudo bash deploy/nginx-allow-ip.sh add 1.2.3.0/24 2h   # 临时加 2 小时，到期自动移除
#   sudo bash deploy/nginx-allow-ip.sh remove 1.2.3.4
#
# 注意：普通账号登录走 /api/member/login，不受白名单限制；
#       $errorjiang_real_ip 仍然必须保留，否则访问日志会记成代理对端 IP。

geo $errorjiang_admin_ok {
    default 1;         # 1 = 白名单关闭，改成 0 即开启白名单
    127.0.0.1 1;       # 服务器本机（健康检查、内网调试）
    # errorjiang-allow-begin（由 nginx-allow-ip.sh 维护，手改也行）
    111.18.134.33 1;   # 管理员常用公网出口
    # errorjiang-allow-end
}

# nginx 会用直连对端覆盖 X-Forwarded-For，取最后一个值即真实来源
map $http_x_forwarded_for $errorjiang_real_ip {
    default $remote_addr;
    ~^(?<errorjiang_xff>.+),\s*(?<errorjiang_last>[0-9a-fA-F:.]+)$ $errorjiang_last;
    ~^(?<errorjiang_last2>[0-9a-fA-F:.]+)$ $errorjiang_last2;
}
