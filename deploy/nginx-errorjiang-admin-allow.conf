# Error酱 管理员入口白名单
# 安装位置：/etc/nginx/conf.d/errorjiang-admin-allow.conf
# 该文件在 http 上下文被加载（conf.d/*.conf），提供两个变量：
#   $errorjiang_admin_ok  1 = 允许访问管理员入口，0 = 返回 403
#                         （2026-10-10 起各 location 不再判断这个变量，
#                          管理员入口改成密码 + 登录限速保护，本变量保留备用）
#   $errorjiang_real_ip   真实客户端 IP，用于反代转发和访问日志
#
# 重新启用白名单时：把 deploy/nginx-errorjiang.conf 里注释掉的 if 判断加回来，
# 并把当前公网出口 IP 加进下面的 geo，然后执行：
#   nginx -t && systemctl reload nginx
#
# 注意：普通账号登录走 /api/member/login，不受白名单限制；
#       $errorjiang_real_ip 仍然必须保留，否则访问日志会记成代理对端 IP。

geo $errorjiang_admin_ok {
    default 0;
    111.18.134.33 1;   # 管理员当前公网出口
    127.0.0.1 1;       # 服务器本机（健康检查、内网调试）
}

# nginx 会用直连对端覆盖 X-Forwarded-For，取最后一个值即真实来源
map $http_x_forwarded_for $errorjiang_real_ip {
    default $remote_addr;
    ~^(?<errorjiang_xff>.+),\s*(?<errorjiang_last>[0-9a-fA-F:.]+)$ $errorjiang_last;
    ~^(?<errorjiang_last2>[0-9a-fA-F:.]+)$ $errorjiang_last2;
}
