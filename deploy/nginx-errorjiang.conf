# Error酱 反向代理模板（阿里云 ECS + Nginx）
# 安装位置：/etc/nginx/sites-available/errorjiang.conf（再 ln -s 到 sites-enabled）
#
# 依赖 /etc/nginx/conf.d/errorjiang-admin-allow.conf 提供：
#   $errorjiang_real_ip   真实客户端 IP（替换 $proxy_add_x_forwarded_for，
#                         否则应用日志会把所有访客记成代理对端 IP）
#   $errorjiang_admin_ok  管理员入口白名单判断（2026-10-10 起不再使用，保留备用）
#
# 2026-10-10：管理员入口不再按 IP 白名单限制（要管理后台时用手机、平板等
# 任意网络都能登录），登录接口仍保留 limit_req 限速 + 密码校验；/api/register
# 是普通账号的公开注册申请入口，同样需要对外可达。
# 如需恢复「方案 A」白名单，把这段判断加回各 location 即可：
#   if ($errorjiang_admin_ok = 0) { return 403 "管理员入口仅限受信任的 IP 访问。"; }

limit_req_zone $binary_remote_addr zone=errorjiang_login:10m rate=6r/m;

server {
    listen 443 ssl;
    server_name errorjiang.example.com;

    ssl_certificate     /etc/letsencrypt/live/errorjiang.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errorjiang.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 84m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 普通账号登录：任何来源都可以，仍受登录限流保护
    location = /api/member/login {
        limit_req zone=errorjiang_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理员登录入口（不带用户名的表单）：非白名单 IP 一律 403
    location = /api/login {

        limit_req zone=errorjiang_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/register {
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /workbench {

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/workbench {

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/prompts {

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/admin {

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    # 公开页面：所有人可访问
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 80 端口只用于证书续期，其余请求交给 certbot 生成的域名 server 块处理
server {
    listen 80;
    server_name errorjiang.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
