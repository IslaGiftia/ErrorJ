# Error酱 反向代理模板（阿里云 ECS + Nginx）
# 安装位置：/etc/nginx/sites-available/errorjiang.conf（再 ln -s 到 sites-enabled）
#
# 依赖 /etc/nginx/conf.d/errorjiang-admin-allow.conf 提供：
#   $errorjiang_admin_ok  管理员入口白名单判断
#   $errorjiang_real_ip   真实客户端 IP（替换 $proxy_add_x_forwarded_for，
#                         否则应用日志会把所有访客记成代理对端 IP）
#
# 本模板对应「方案 A」：站点对公网开放，但管理员入口（登录、工作台、
# 动态管理、管理 API、注册）只允许白名单 IP 访问；公网 IP 直连入口已移除。

limit_req_zone $binary_remote_addr zone=errorjiang_login:10m rate=6r/m;

server {
    listen 443 ssl;
    server_name errorjiang.example.com;

    ssl_certificate     /etc/letsencrypt/live/errorjiang.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errorjiang.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 84m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 管理员入口：非白名单 IP 一律 403
    location = /api/login {
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。\n";
        }

        limit_req zone=errorjiang_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/register {
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。\n";
        }
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。\n";
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /workbench {
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。\n";
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/workbench {
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。\n";
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/prompts {
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。\n";
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/admin {
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。\n";
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    # 公开页面：所有人可访问
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 80 端口只用于证书续期，其余请求交给 certbot 生成的域名 server 块处理
server {
    listen 80;
    server_name errorjiang.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
