# Error酱 反向代理示例（阿里云 ECS + Nginx）
# 1) 把 errorjiang.example.com 换成你的域名，或删掉 server_name 用 IP 访问
# 2) 证书可用 certbot（Let's Encrypt）或阿里云免费证书，改下面的 ssl_certificate 路径
# 3) 应用只监听 127.0.0.1:8000，公网只开 80/443

# 这个文件要放在 http { } 里面（例如 /etc/nginx/conf.d/errorjiang.conf），
# limit_req_zone 只能出现在 http 上下文。
limit_req_zone $binary_remote_addr zone=errorjiang_login:10m rate=6r/m;

server {
    listen 80;
    server_name errorjiang.example.com;
    # 申请证书时保留，签完证书后可以改成强制跳转
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.25+ 请改成下面的形式（旧写法会有 deprecation 警告）：
    #   listen 443 ssl;
    #   http2 on;
    listen 443 ssl http2;
    server_name errorjiang.example.com;

    ssl_certificate     /etc/letsencrypt/live/errorjiang.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errorjiang.example.com/privkey.pem;

    # 上传留言附件最大 40MB，和 app.py 的 MAX_REQUEST_BYTES 对齐
    client_max_body_size 40m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 登录接口单独限流，防爆破（应用里也有 5 次/5 分钟的限制）
    location = /api/login {
        limit_req zone=errorjiang_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
