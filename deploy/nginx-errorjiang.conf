# Error酱 反向代理模板（阿里云 ECS + Nginx）
# 安装位置：/etc/nginx/sites-available/errorjiang.conf（再 ln -s 到 sites-enabled）
#
# 依赖 /etc/nginx/conf.d/errorjiang-admin-allow.conf 提供：
#   $errorjiang_real_ip   真实客户端 IP（替换 $proxy_add_x_forwarded_for，
#                         否则应用日志会把所有访客记成代理对端 IP）
#   $errorjiang_admin_ok  管理员入口白名单判断（2026-10-10 起不再使用，保留备用）
#
# 2026-10-10：管理员入口的 IP 白名单改成「可开关」——
#   下面各 location 的 if 判断配合 geo 变量生效，而 geo 里 default 1 时判断不触发，
#   也就是默认任意网络都能登录后台（手机、平板都方便）；
#   需要收紧时在服务器上执行（改 default 0 + reload，失败自动回滚）：
#     sudo bash deploy/nginx-allow-ip.sh strict      # 只允许白名单内的 IP / 网段
#     sudo bash deploy/nginx-allow-ip.sh open        # 恢复任意网络可访问
#     sudo bash deploy/nginx-allow-ip.sh add 1.2.3.4 2h   # 临时加 2 小时，到期自动移除
# 管理员登录始终保留 limit_req 限速 + 密码校验。
# 2026-10-10 起 /api/register 不再属于「管理员入口」：普通账号注册申请对任意网络
# 开放（应用层另有每 IP 24 小时 3 次 + 同时最多 1 条待审核的限额），
# 有它自己的 limit_req 限速。

limit_req_zone $binary_remote_addr zone=errorjiang_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=errorjiang_register:10m rate=3r/m;

server {
    listen 443 ssl;
    server_name errorjiang.example.com;

    ssl_certificate     /etc/letsencrypt/live/errorjiang.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/errorjiang.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 84m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 普通账号登录：任何来源都可以，仍受登录限流保护
    location = /api/member/login {
        limit_req zone=errorjiang_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理员登录入口（不带用户名的表单）：非白名单 IP 一律 403
    location = /api/login {
        # geo 里 default 1 时这段不生效（白名单关闭），改成 default 0 才会拦截
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员登录仅限受信任的 IP 访问。";
        }


        limit_req zone=errorjiang_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/register {
        # 游客注册申请入口：不受管理员白名单限制，只做接口级限速
        limit_req zone=errorjiang_register burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        # geo 里 default 1 时这段不生效（白名单关闭），改成 default 0 才会拦截
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。";
        }


        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /workbench {
        # geo 里 default 1 时这段不生效（白名单关闭），改成 default 0 才会拦截
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。";
        }


        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/workbench {
        # geo 里 default 1 时这段不生效（白名单关闭），改成 default 0 才会拦截
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。";
        }


        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/prompts {
        # geo 里 default 1 时这段不生效（白名单关闭），改成 default 0 才会拦截
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。";
        }


        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/admin {
        # geo 里 default 1 时这段不生效（白名单关闭），改成 default 0 才会拦截
        if ($errorjiang_admin_ok = 0) {
            return 403 "管理员入口仅限受信任的 IP 访问。";
        }


        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    # 公开页面：所有人可访问
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 80 端口只用于证书续期，其余请求交给 certbot 生成的域名 server 块处理
server {
    listen 80;
    server_name errorjiang.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
