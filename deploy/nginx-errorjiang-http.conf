# Error酱 HTTP 部署配置（域名和 HTTPS 配好前使用，保留作历史备份）
# 安装位置：/etc/nginx/sites-available/errorjiang.conf
# 依赖 /etc/nginx/conf.d/errorjiang-admin-allow.conf 提供 $errorjiang_real_ip
# （$errorjiang_admin_ok 2026-10-10 起不再使用，保留备用）；该文件在 http 上下文加载。

limit_req_zone $binary_remote_addr zone=errorjiang_login:10m rate=6r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 84m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/member/login {
        client_max_body_size 16k;
        limit_req zone=errorjiang_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/login {

        client_max_body_size 16k;
        limit_req zone=errorjiang_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/register {

        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /workbench {

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/workbench {

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/prompts {

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location ^~ /api/admin {

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 84m;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $errorjiang_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
